<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AXAC Chess - Apex Engine</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* =========================================
       CSS VARIABLES & RESET
       ========================================= */
    :root {
      --bg-base: #03050a;
      --bg-panel: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --accent: #06b6d4;
      --danger: #ef4444;
      --success: #10b981;
      --purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-mut: #94a3b8;
      --sq-light: #cbd5e1;
      --sq-dark: #334155;
      --sq-hl: rgba(59, 130, 246, 0.75);
      --sq-guide: rgba(16, 185, 129, 0.9);
      --shadow: 0 10px 40px -10px rgba(0,0,0,0.9);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; background-image: radial-gradient(circle at 50% -20%, var(--primary-glow) 0%, transparent 60%); background-attachment: fixed; }

    /* =========================================
       SPLASH SCREEN (ANTI-STUCK CSS MURNI)
       ========================================= */
    @keyframes forceHide {
      0% { opacity: 1; visibility: visible; }
      85% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; z-index: -1; }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    #splash { 
      position: fixed; inset: 0; background: var(--bg-base); z-index: 99999; 
      display: flex; flex-direction: column; justify-content: center; align-items: center; 
      animation: forceHide 0.6s forwards; /* Force hilang dalam 0.6 detik */
    }
    .loader-ring { width: 60px; height: 60px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 24px; }
    .splash-title { font-weight: 800; font-size: 1.8rem; letter-spacing: 3px; color: var(--primary); }

    /* =========================================
       HEADER & LAYOUT RATA KANAN
       ========================================= */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    header { background: var(--bg-panel); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; animation: fadeIn 0.5s ease; }
    .brand { font-weight: 800; font-size: 1.4rem; background: linear-gradient(135deg, var(--accent), var(--primary), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .main-layout { display: grid; grid-template-columns: 1fr 400px; gap: 24px; max-width: 1300px; margin: 24px auto; padding: 0 24px; width: 100%; flex: 1; animation: fadeIn 0.5s ease; }
    @media (max-width: 950px) { .main-layout { grid-template-columns: 1fr; } }

    /* =========================================
       BOARD AREA
       ========================================= */
    .board-container { display: flex; flex-direction: column; align-items: center; width: 100%; }
    .status-bar { width: 100%; max-width: 560px; display: flex; justify-content: space-between; font-weight: 800; font-size: 0.95rem; background: var(--bg-panel); padding: 14px 20px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 16px; box-shadow: var(--shadow); }
    .board-wrap { width: 100%; max-width: 560px; aspect-ratio: 1; margin-bottom: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; border: 8px solid #0f172a; border-radius: 16px; overflow: hidden; background: #0f172a; }
    .sq { display: flex; justify-content: center; align-items: center; cursor: pointer; position: relative; }
    .sq.light { background: var(--sq-light); }
    .sq.dark { background: var(--sq-dark); }
    .sq.hl { background: var(--sq-hl) !important; }
    .sq.guide::after { content: ''; position: absolute; width: 28%; height: 28%; background: var(--sq-guide); border-radius: 50%; z-index: 10; box-shadow: 0 0 10px var(--sq-guide); }
    .sq svg { width: 88%; height: 88%; pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    .board-controls { display: flex; gap: 12px; width: 100%; max-width: 560px; }

    /* =========================================
       PANEL KANAN
       ========================================= */
    .right-panel { display: flex; flex-direction: column; gap: 20px; height: 100%; }
    .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 16px; }
    .panel h3 { font-size: 0.9rem; color: var(--text-mut); text-transform: uppercase; letter-spacing: 1px; font-weight: 800; }

    /* =========================================
       COMPONENTS
       ========================================= */
    .btn { background: var(--primary); color: #fff; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; width: 100%; box-shadow: 0 4px 15px var(--primary-glow); }
    .btn:hover { background: #2563eb; }
    .btn-danger { background: var(--danger); box-shadow: 0 4px 15px rgba(239,68,68,0.4); }
    .btn-purple { background: var(--purple); box-shadow: 0 4px 15px rgba(139,92,246,0.4); }
    .btn-sm { padding: 8px 12px; font-size: 0.8rem; width: auto; }
    
    .input-grp { margin-bottom: 16px; }
    .input-grp input, select { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 10px; color: var(--text-main); outline: none; font-size: 0.9rem; }
    .input-grp input:focus { border-color: var(--primary); }

    /* =========================================
       MUSIC PLAYER & TERMINAL
       ========================================= */
    .music-player { background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .track-info { font-weight: 800; font-size: 0.9rem; color: var(--accent); margin-bottom: 16px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-controls { display: flex; justify-content: center; gap: 16px; margin-bottom: 16px; }
    .ctrl-btn { background: rgba(15, 23, 42, 1); border: 1px solid var(--border); color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; font-size: 1.2rem; }
    .ctrl-btn:hover { background: var(--primary); border-color: var(--primary); }
    .track-list { display: flex; flex-direction: column; gap: 8px; }
    .track-item { padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; border: 1px solid transparent; color: var(--text-mut); transition: 0.2s; }
    .track-item:hover { background: rgba(255,255,255,0.05); }
    .track-item.active { background: rgba(59,130,246,0.15); border-color: var(--primary); color: var(--primary); font-weight: 700; }

    .terminal { background: #000; color: var(--success); font-family: monospace; font-size: 0.75rem; padding: 12px; border-radius: 8px; height: 140px; overflow-y: auto; border: 1px solid var(--border); line-height: 1.4; }
    .terminal-eng { color: var(--accent); }

    /* =========================================
       MODALS
       ========================================= */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .overlay.show { display: flex; }
    .modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 20px; padding: 24px; width: 100%; max-width: 420px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div id="splash">
    <div class="loader-ring"></div>
    <div class="splash-title">AXAC APEX</div>
  </div>

  <header>
    <div class="brand">AXAC 3D</div>
    <div style="display: flex; gap: 16px; align-items: center;">
      <div id="clock" style="font-family: monospace; color: var(--accent);">00:00:00</div>
      <button class="btn btn-sm btn-danger hidden" id="logoutBtn" onclick="Auth.logout()">Keluar</button>
    </div>
  </header>

  <div id="authScreen" style="max-width: 400px; margin: 80px auto; width: 90%;">
    <div class="panel">
      <h2 style="text-align: center; margin-bottom: 24px;">LOGIN</h2>
      <div class="input-grp"><input type="text" id="authUser" placeholder="Username"></div>
      <div class="input-grp"><input type="password" id="authPass" placeholder="Password"></div>
      <button class="btn" style="margin-bottom: 12px;" onclick="Auth.login()">MASUK</button>
      <button class="btn" style="background: transparent; border: 1px solid var(--border);" onclick="Auth.register()">DAFTAR</button>
    </div>
  </div>

  <div id="gameScreen" class="main-layout hidden">
    <div class="board-container">
      <div class="status-bar">
        <span>Lawan: <span style="color: var(--danger);">AI</span></span>
        <span>Kamu: <span id="uName" style="color: var(--primary);">-</span></span>
      </div>
      <div class="board-wrap"><div id="board" class="board"></div></div>
      <div class="board-controls">
        <button class="btn btn-danger" onclick="Game.resign()">Nyerah</button>
        <button class="btn btn-purple" onclick="Game.hint()">💡 Bantuan</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel">
        <h3>AI Difficulty</h3>
        <select id="modeSelect" onchange="Game.changeMode()">
          <option value="ai-easy">Pemula</option>
          <option value="ai-medium">Menengah</option>
          <option value="ai-hard">Sulit</option>
          <option value="ai-god" selected>🔥 God Mode (Depth 5)</option>
        </select>
      </div>
      <div class="panel">
        <h3>Audio System</h3>
        <div class="music-player">
          <div class="track-info" id="trackTitle">Pilih Lagu</div>
          <div class="player-controls">
            <button class="ctrl-btn" onclick="Audio.prev()">⏮</button>
            <button class="ctrl-btn" id="playBtn" onclick="Audio.toggle()">▶</button>
            <button class="ctrl-btn" onclick="Audio.next()">⏭</button>
          </div>
          <div class="track-list" id="trackList"></div>
        </div>
      </div>
      <div class="panel">
        <h3>🛡️ Guard System</h3>
        <div id="guardTerminal" class="terminal">> Initializing Security...</div>
      </div>
      <div class="panel">
        <h3>🛠️ Engineer System</h3>
        <div id="engTerminal" class="terminal terminal-eng">> Analyzing Engine...</div>
      </div>
    </div>
  </div>

  <div id="hintModal" class="overlay">
    <div class="modal">
      <h3 style="color: var(--purple); margin-bottom: 16px;">💡 Saran</h3>
      <p id="hintText" style="margin-bottom: 20px; font-family: monospace; font-size: 1.2rem;">...</p>
      <button class="btn btn-purple" onclick="UI.closeModal('hintModal')">Tutup</button>
    </div>
  </div>

<script>
/* =========================================
   KONFIGURASI & INISIALISASI
   ========================================= */
const SUPABASE_URL = 'https://ybmnctzesvqgvyivvmfm.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ygZ8QlCqTuVkVR_mKfpIYw_O3EuMr6C'; 
let db = null;
let currentUser = null;

window.addEventListener('DOMContentLoaded', () => {
  try { db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) { console.error("Supabase Init Failed"); }

  setInterval(() => {
    const clockEl = document.getElementById('clock');
    if(clockEl) clockEl.innerText = new Date().toLocaleTimeString('id-ID');
  }, 1000);

  const saved = localStorage.getItem('axac_user');
  if(saved) { currentUser = saved; Auth.showGame(); }
});

const UI = {
  openModal: (id) => { const el = document.getElementById(id); if(el) el.classList.add('show'); },
  closeModal: (id) => { const el = document.getElementById(id); if(el) el.classList.remove('show'); }
};

/* =========================================
   AUDIO SYSTEM
   ========================================= */
const Audio = {
  tracks: [
    { title: "Merry Christmas Please Dont Call", url: "https://files.catbox.moe/qaz1xd.mp3" },
    { title: "Terranova", url: "https://files.catbox.moe/f01dyl.mp3" },
    { title: "Medusa", url: "https://files.catbox.moe/h9cyas.mp3" }
  ],
  idx: 0, audio: new window.Audio(), isPlaying: false,
  init: () => {
    const list = document.getElementById('trackList'); if(!list) return;
    list.innerHTML = '';
    Audio.tracks.forEach((t, i) => {
      const div = document.createElement('div'); div.className = `track-item ${i === 0 ? 'active' : ''}`;
      div.innerText = t.title; div.onclick = () => Audio.play(i); list.appendChild(div);
    });
    Audio.audio.src = Audio.tracks[0].url; Audio.audio.onended = Audio.next;
  },
  play: (i) => {
    Audio.idx = i; Audio.audio.src = Audio.tracks[i].url; 
    Audio.audio.play().catch(e => console.log("Audio Error:", e));
    Audio.isPlaying = true; 
    const title = document.getElementById('trackTitle'); if(title) title.innerText = Audio.tracks[i].title;
    const btn = document.getElementById('playBtn'); if(btn) btn.innerText = "⏸";
    document.querySelectorAll('.track-item').forEach((el, idx) => el.className = `track-item ${idx === i ? 'active' : ''}`);
  },
  toggle: () => {
    if(!Audio.audio.src) return Audio.play(0);
    if(Audio.isPlaying) { Audio.audio.pause(); const btn = document.getElementById('playBtn'); if(btn) btn.innerText = "▶"; }
    else { Audio.audio.play().catch(e=>console.log(e)); const btn = document.getElementById('playBtn'); if(btn) btn.innerText = "⏸"; }
    Audio.isPlaying = !Audio.isPlaying;
  },
  next: () => Audio.play((Audio.idx + 1) % Audio.tracks.length),
  prev: () => Audio.play((Audio.idx - 1 + Audio.tracks.length) % Audio.tracks.length)
};

/* =========================================
   AUTH SYSTEM
   ========================================= */
const Auth = {
  login: async () => {
    if(!db) return alert("Sistem database belum siap.");
    const u = document.getElementById('authUser').value.trim(); 
    const p = document.getElementById('authPass').value.trim();
    if(!u || !p) return alert("Isi data!");
    
    const { data, error } = await db.from('profiles').select('*').eq('username', u).eq('password', p).single();
    if(error || !data) return alert("Salah data!");
    
    currentUser = data.username; 
    localStorage.setItem('axac_user', currentUser); 
    Auth.showGame();
  },
  register: async () => {
    if(!db) return alert("Sistem database belum siap.");
    const u = document.getElementById('authUser').value.trim(); 
    const p = document.getElementById('authPass').value.trim();
    if(!u || !p) return alert("Isi data!");
    const { error } = await db.from('profiles').insert([{ username: u, password: p }]);
    if(error) return alert("Gagal daftar!");
    alert("Silakan login.");
  },
  showGame: () => {
    const authScr = document.getElementById('authScreen'); if(authScr) authScr.classList.add('hidden');
    const gameScr = document.getElementById('gameScreen'); if(gameScr) gameScr.classList.remove('hidden');
    const logoutBtn = document.getElementById('logoutBtn'); if(logoutBtn) logoutBtn.classList.remove('hidden');
    const uName = document.getElementById('uName'); if(uName) uName.innerText = currentUser;
    
    setTimeout(() => {
      Game.init(); Audio.init(); GuardAI.start(); EngineerAI.start();
    }, 100);
  },
  logout: () => { localStorage.removeItem('axac_user'); location.reload(); }
};

/* =========================================
   AI GUARD & ENGINEER
   ========================================= */
const GuardAI = {
  start: () => {
    const term = document.getElementById('guardTerminal'); if(!term) return;
    term.innerHTML += "<br>> [SYS] Guard Online.";
    setInterval(() => {
      const t = document.getElementById('guardTerminal');
      if(t && Math.random() > 0.6) { t.innerHTML += `<br>> [AI] Scanning... OK`; t.scrollTop = t.scrollHeight; }
    }, 5000);
  }
};

const EngineerAI = {
  start: () => {
    const term = document.getElementById('engTerminal'); if(!term) return;
    term.innerHTML += "<br>> [SYS] Engineer Online.";
    let lastTime = performance.now(); let frames = 0;
    function loop() {
      frames++; let now = performance.now();
      if(now - lastTime > 1000) {
        const t = document.getElementById('engTerminal');
        if(t && frames < 40) { t.innerHTML += `<br>> [⚠️] Lag: ${frames}fps. Fixing...`; EngineerAI.cleanMemory(); }
        else if(t && Math.random() > 0.8) { t.innerHTML += `<br>> [AI] Stable ${frames}fps.`; }
        if(t) t.scrollTop = t.scrollHeight;
        frames = 0; lastTime = now;
      }
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  },
  cleanMemory: () => {
    const term = document.getElementById('engTerminal');
    setTimeout(() => { if(term) { term.innerHTML += `<br>> [AI] Memory Cleaned.`; term.scrollTop = term.scrollHeight; } }, 800);
  }
};

  K: '<svg viewBox="0 0 45 45"><path d="M22.5 6v3h-3v2h3v3h2v-3h3V9h-3V6h-2zm-6.5 10c-3 0-5 2-5 5 0 2.5 1.5 4.5 3.5 5.5V33h16v-6.5c2-1 3.5-3 3.5-5.5 0-3-2-5-5-5h-13z" fill="#fff" stroke="#0f172a" stroke-width="1.5"/></svg>'
};

const Game = {
  chess: null, sel: null, mode: 'ai-god', isThinking: false,
  
  pst: {
    p: [[0,0,0,0,0,0,0,0],[50,50,50,50,50,50,50,50],[10,10,20,30,30,20,10,10],[5,5,10,25,25,10,5,5],[0,0,0,20,20,0,0,0],[5,-5,-10,0,0,-10,-5,5],[5,10,10,-20,-20,10,10,5],[0,0,0,0,0,0,0,0]],
    n: [[-50,-40,-30,-30,-30,-30,-40,-50],[-40,-20,0,0,0,0,-20,-40],[-30,0,10,15,15,10,0,-30],[-30,5,15,20,20,15,5,-30],[-30,0,15,20,20,15,0,-30],[-30,5,10,15,15,10,5,-30],[-40,-20,0,5,5,0,-20,-40],[-50,-40,-30,-30,-30,-30,-40,-50]],
    b: [[-20,-10,-10,-10,-10,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,10,10,5,0,-10],[-10,5,5,10,10,5,5,-10],[-10,0,10,10,10,10,0,-10],[-10,10,10,10,10,10,10,-10],[-10,5,0,0,0,0,5,-10],[-20,-10,-10,-10,-10,-10,-10,-20]],
    r: [[0,0,0,0,0,0,0,0],[5,10,10,10,10,10,10,5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[-5,0,0,0,0,0,0,-5],[0,0,0,5,5,0,0,0]],
    q: [[-20,-10,-10,-5,-5,-10,-10,-20],[-10,0,0,0,0,0,0,-10],[-10,0,5,5,5,5,0,-10],[-5,0,5,5,5,5,0,-5],[0,0,5,5,5,5,0,-5],[-10,5,5,5,5,5,0,-10],[-10,0,5,0,0,0,0,-10],[-20,-10,-10,-5,-5,-10,-10,-20]],
    k: [[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-30,-40,-40,-50,-50,-40,-40,-30],[-20,-30,-30,-40,-40,-30,-30,-20],[-10,-20,-20,-20,-20,-20,-20,-10],[20,20,0,0,0,0,20,20],[20,30,10,0,0,10,30,20]]
  },
  init: () => { Game.chess = new Chess(); Game.sel = null; Game.isThinking = false; Game.render(); },
  render: () => {
    const b = document.getElementById('board'); if(!b) return; b.innerHTML = '';
    Game.chess.board().forEach((row, r) => {
      row.forEach((p, c) => {
        const sq = document.createElement('div'); sq.className = `sq ${(r+c)%2 === 0 ? 'light' : 'dark'}`;
        const id = String.fromCharCode(97+c) + (8-r);
        if(p) sq.innerHTML = P[p.color === 'w' ? p.type.toUpperCase() : p.type];
        if(Game.sel === id) sq.classList.add('hl');
        if(Game.sel && Game.chess.moves({ square: Game.sel, verbose: true }).some(m => m.to === id)) sq.classList.add('guide');
        sq.onclick = () => Game.click(id); b.appendChild(sq);
      });
    });
  },
  click: (id) => {
    if(Game.chess.game_over() || Game.isThinking) return;
    if(Game.sel && Game.chess.moves({ square: Game.sel, verbose: true }).some(m => m.to === id)) {
      Game.chess.move({ from: Game.sel, to: id, promotion: 'q' }); Game.sel = null; Game.render();
      if(!Game.chess.game_over()) setTimeout(Game.aiMove, 100);
      return;
    }
    const p = Game.chess.get(id); Game.sel = (p && p.color === Game.chess.turn()) ? id : null; Game.render();
  },
  aiMove: () => {
    if(Game.chess.game_over() || Game.isThinking) return;
    Game.isThinking = true;
    setTimeout(() => {
      const moves = Game.chess.moves({ verbose: true }); 
      if(!moves.length) { Game.isThinking = false; return; }
      let depth = Game.mode === 'ai-easy' ? 1 : Game.mode === 'ai-medium' ? 2 : Game.mode === 'ai-hard' ? 3 : 5;
      let bestMove = moves[0], bestVal = -Infinity;
      for(let m of moves) {
        Game.chess.move(m); let val = -Game.minimax(depth - 1, -Infinity, Infinity, false); Game.chess.undo();
        if(val > bestVal) { bestVal = val; bestMove = m; }
      }
      Game.chess.move(bestMove); Game.isThinking = false; Game.render();
    }, 50);
  },
  minimax: (depth, alpha, beta, isMax) => {
    if(depth === 0 || Game.chess.game_over()) return Game.evaluate();
    const moves = Game.chess.moves();
    if(isMax) {
      let max = -Infinity;
      for(let m of moves) {
        Game.chess.move(m); max = Math.max(max, Game.minimax(depth - 1, alpha, beta, false)); Game.chess.undo();
        alpha = Math.max(alpha, max); if(beta <= alpha) break;
      }
      return max;
    } else {
      let min = Infinity;
      for(let m of moves) {
        Game.chess.move(m); min = Math.min(min, Game.minimax(depth - 1, alpha, beta, true)); Game.chess.undo();
        beta = Math.min(beta, min); if(beta <= alpha) break;
      }
      return min;
    }
  },
  evaluate: () => {
    const vals = { p: 10, n: 30, b: 35, r: 50, q: 90, k: 9000 }; let score = 0;
    const board = Game.chess.board();
    for(let r=0; r<8; r++) {
      for(let c=0; c<8; c++) {
        const p = board[r][c];
        if(p) {
          let val = vals[p.type];
          if(Game.pst[p.type]) val += Game.pst[p.type][p.color === 'w' ? r : 7-r][c];
          score += (p.color === 'w' ? val : -val);
        }
      }
    }
    return Game.chess.turn() === 'w' ? score : -score;
  },
  changeMode: () => { Game.mode = document.getElementById('modeSelect').value; Game.init(); },
  resign: () => { if(confirm("Yakin?")) Game.init(); },
  hint: () => {
    const moves = Game.chess.moves({ verbose: true }); if(!moves.length) return;
    let bestM = moves[0], bestV = -Infinity;
    for(let m of moves) { Game.chess.move(m); let v = -Game.minimax(2, -Infinity, Infinity, false); Game.chess.undo(); if(v > bestV) { bestV = v; bestM = m; } }
    document.getElementById('hintText').innerText = `Langkah: ${bestM.san}`; UI.openModal('hintModal');
  }
};
</script>
